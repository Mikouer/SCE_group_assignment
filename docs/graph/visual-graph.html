            // Claims Serve Objectives
            { from: 'CL1', to: 'OBJ-01', label: 'serves', color: { color: '#7b1fa2' }, width: 1 },

            // Evaluation Methods & Measures
            { from: 'EM-01', to: 'M-02', label: 'evaluates', color: { color: '#ff6f00' }, width: 1 },

            { from: 'AT-01', to: 'UC01', label: 'instantiates', color: { color: '#e65100' }, width: 2 },

            { from: 'AT-01', to: 'F4', label: 'instantiates', color: { color: '#e65100' }, width: 1 },
            
            { from: 'AT-01', to: 'ER-01', label: 'used-by', color: { color: '#e65100' }, width: 2 },
            { from: 'AT-01', to: 'EM-01', label: 'used-by', color: { color: '#e65100' }, width: 1 },
            { from: 'AT-01', to: 'EM-02', label: 'used-by', color: { color: '#e65100' }, width: 1 },

            { from: 'ER-01', to: 'PR3', label: 'evaluates', color: { color: '#d84315' }, width: 1 },
            { from: 'ER-01', to: 'CL3', label: 'evaluates', color: { color: '#d84315' }, width: 1 },
        ];
        
        // Create nodes and edges collections
        const nodes = new vis.DataSet(nodesData);
        const edges = new vis.DataSet(edgesData);
        
        const data = {
            nodes: nodes,
            edges: edges
        };
        
        const options = {
            physics: {
                enabled: true,
                barnesHut: {
                    gravitationalConstant: -26000,
                    centralGravity: 0.3,
                    springLength: 200,
                    springConstant: 0.04
                }
            },
            nodes: {
                font: {
                    size: 14,
                    face: 'Segoe UI',
                    color: '#333'
                },
                borderWidth: 2,
                borderWidthSelected: 4,
                shadow: {
                    enabled: true,
                    color: 'rgba(0,0,0,0.2)',
                    size: 10,
                    x: 5,
                    y: 5
                }
            },
            edges: {
                font: {
                    size: 12,
                    align: 'middle',
                    color: '#666'
                },
                arrows: {
                    to: {
                        enabled: true,
                        scaleFactor: 0.5
                    }
                },
                shadow: {
                    enabled: true,
                    color: 'rgba(0,0,0,0.1)',
                    size: 5,
                    x: 3,
                    y: 3
                },
                smooth: {
                    type: 'continuous'
                }
            },
            interaction: {
                hover: true,
                navigationButtons: true,
                keyboard: true
            }
        };
        
        const network = new vis.Network(document.getElementById('network'), data, options);
        
        // Node detail panel
        network.on('click', function(params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.get(nodeId);
                const sidebarContent = document.getElementById('sidebarContent');
                
                sidebarContent.innerHTML = `
                    <h3>${node.label}</h3>
                    <p><strong>Type:</strong> ${node.type}</p>
                    <p><strong>Description:</strong> ${node.title}</p>
                    <p style="font-size: 11px; color: #999; margin-top: 10px;">ID: ${nodeId}</p>
                `;
            }
        });
        
        // Type filter
        document.getElementById('typeFilter').addEventListener('change', function(e) {
            const filterType = e.target.value;
            
            if (filterType === '') {
                nodes.forEach(node => {
                    nodes.update({id: node.id, hidden: false});
                });
                edges.forEach(edge => {
                    edges.update({id: edge.id, hidden: false});
                });
            } else {
                nodes.forEach(node => {
                    const hidden = node.type !== filterType;
                    nodes.update({id: node.id, hidden: hidden});
                });
                
                edges.forEach(edge => {
                    const fromNode = nodes.get(edge.from);
                    const toNode = nodes.get(edge.to);
                    const hidden = fromNode.hidden || toNode.hidden;
                    edges.update({id: edge.id, hidden: hidden});
                });
            }
            
            network.fit({animation: {duration: 500}});
        });
        
        // Physics toggle
        document.getElementById('togglePhysics').addEventListener('click', function() {
            const physicsEnabled = options.physics.enabled;
            options.physics.enabled = !physicsEnabled;
            network.setOptions(options);
            this.textContent = physicsEnabled ? 'Start Simulation' : 'Stop Simulation';
        });
        
        // Reset view
        document.getElementById('resetView').addEventListener('click', function() {
            network.fit({animation: {duration: 500}});
        });
        
        // Export as PNG
        document.getElementById('exportPNG').addEventListener('click', function() {
            const canvas = document.querySelector('canvas');
            const link = document.createElement('a');
            link.href = canvas.toDataURL();
            link.download = 'echo-knowledge-graph.png';
            link.click();
        });
        
        // Initial fit
        network.fit({animation: {duration: 1000}});
    </script>
